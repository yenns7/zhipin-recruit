# 智聘 · 招聘管理系统 — docker-compose（本地/服务器一键起环境用）
#
# 部署形态与 ADR-0001 / DEPLOYMENT.md §6 一致：一个 Flask 后端（同源托管前端 dist）
# + 一个 PostgreSQL。不引入新进程拓扑，只是把既定的两个进程容器化。
#
# 使用前：
#   1. 复制 backend/.env.example 为 backend/.env 并填入真实值（JWT_SECRET、LLM Key 等）。
#   2. docker compose up -d --build
#   3. 访问 http://localhost:5000

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhipin}
      POSTGRES_USER: ${POSTGRES_USER:-zhipin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
    volumes:
      - zhipin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhipin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      # 覆盖 .env 里的 DATABASE_URL，指向 compose 内的 db 服务；其余变量沿用 .env。
      DATABASE_URL: postgresql://${POSTGRES_USER:-zhipin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zhipin}
      FLASK_DEBUG: "false"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - zhipin_uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  zhipin_pgdata:
  zhipin_uploads:
