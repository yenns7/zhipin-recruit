[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhiping-mcp"
version = "0.1.0"
description = "智聘招聘管理系统的MCP服务，供AI助手和第三方应用调用"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "智聘团队" }
]
keywords = ["mcp", "recruitment", "ai", "zhiping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp[cli]>=1.27,<2",
    "pydantic>=2.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
zhiping-mcp = "zhiping_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zhiping_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
